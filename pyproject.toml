[project]
name = "leddeck"
version = "0.1.0"
description = "Pilotage de bandeaux LED WLED (DDP) pour club"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "PySide6>=6.7",
    "sounddevice>=0.4.7",
    "mido>=1.3",
    "python-rtmidi>=1.5",
    "requests>=2.32",
    "zeroconf>=0.132",
]

[project.scripts]
leddeck = "leddeck.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["leddeck"]
